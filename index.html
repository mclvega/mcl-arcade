<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="description" content="McL Arcade: cultiva, fabrica y vende en tus propias tiendas. Juego idle arcade gratis en el navegador." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="McL Arcade" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>McL Arcade</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="menu" hidden>
      <div class="menu-bg" aria-hidden="true">
        <span>🍅</span><span>🍕</span><span>🥐</span><span>🛒</span><span>🚗</span><span>🌽</span><span>🧀</span><span>🍩</span><span>🛞</span><span>🥛</span>
      </div>
      <main class="menu-inner">
        <header class="menu-head">
          <h1 class="logo"><span class="logo-mcl">McL</span> Arcade</h1>
          <p class="tagline">Cultiva, fabrica y vende. Haz crecer tu cadena de tiendas.</p>
          <p id="greeting" class="greeting"></p>
        </header>
        <section id="store-list" class="store-list" aria-label="Tiendas"></section>
        <footer class="menu-foot">
          <button id="menu-customize" type="button">👕 Personaje</button>
          <button id="menu-settings" type="button">⚙️ Configuración</button>
          <button id="menu-help" type="button">❓ Cómo jugar</button>
          <button id="menu-fullscreen" type="button" class="fs-btn">⛶ Pantalla completa</button>
          <button id="menu-reset" type="button" class="danger">Borrar progreso</button>
        </footer>
      </main>
    </div>

    <div id="hud" hidden>
      <div class="hud-left">
        <div id="money"><span class="coin">$</span><span id="money-value">0</span></div>
        <div id="store-name"></div>
        <div id="rep" title="Reputación"><span>⭐</span><span class="rep-bar"><span class="rep-fill"></span></span><span class="rep-value">50</span><span class="rep-diff"></span></div>
      </div>
      <div class="hud-buttons">
        <button id="btn-home" type="button" aria-label="Menú">🏠</button>
        <button id="btn-upgrades" type="button">⬆ Mejoras</button>
        <button id="btn-fullscreen" type="button" class="fs-btn" aria-label="Pantalla completa">⛶</button>
        <button id="btn-settings" type="button" aria-label="Configuración">⚙️</button>
      </div>
      <div id="hint" class="hidden"></div>
    </div>

    <div id="order" hidden>
      <div class="order-head">
        <b>📦 Pedido especial</b>
        <span class="order-time"></span>
        <button type="button" class="order-close" title="Rechazar pedido" aria-label="Rechazar pedido">✕</button>
      </div>
      <div class="order-lines"></div>
      <div class="order-bar"><div></div></div>
      <small class="order-reward"></small>
    </div>

    <button id="action-btn" type="button" hidden><span class="act-icon"></span><span class="act-label"></span></button>
    <div id="joystick"><div id="joy-knob"></div></div>
    <div id="fps" hidden></div>

    <div id="modal" hidden>
      <div class="panel-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="panel-head">
          <h2 id="modal-title"></h2>
          <button id="modal-close" type="button" aria-label="Cerrar">✕</button>
        </div>
        <div id="modal-body"></div>
        <div id="modal-foot" class="panel-foot"></div>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
